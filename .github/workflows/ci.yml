name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - LICENSE
      - .gitignore
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - LICENSE
      - .gitignore
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: ESP-IDF build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: "v5.5.6"
          target: esp32s3
          path: "."
          command: >-
            idf.py build &&
            idf.py merge-bin -o esp32-vibe-rgb-full.bin &&
            cp build/esp32-vibe-rgb.bin build/esp32-vibe-rgb-ota.bin

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            build/esp32-vibe-rgb-full.bin
            build/esp32-vibe-rgb-ota.bin
          if-no-files-found: error
          retention-days: 14
